name: Refresh datasets

on:
  schedule:
    # Mondays and Thursdays at 06:00 UTC. The data itself changes yearly, so
    # once a week would be plenty — the second run exists to keep the free-tier
    # Supabase project from being paused for inactivity, which a single weekly
    # run sits right on the edge of once GitHub delays the scheduled job.
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh Supabase datasets
        run: node scripts/refresh-datasets.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
